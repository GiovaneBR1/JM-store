# Hospedagem no Netlify (https://jmstore.netlify.app).
# O site é estático: não há etapa de build, o Netlify publica a pasta do repositório como está.
# Login, banco, e-mails e automações continuam no Firebase.

[build]
  publish = "."
  command = ""

# Cabeçalhos de segurança para todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    # Não deixa outro site abrir a loja ou a gestão dentro de um quadro (golpe de "clique escondido").
    X-Frame-Options = "DENY"
    # O navegador não tenta "adivinhar" o tipo dos arquivos.
    X-Content-Type-Options = "nosniff"
    # Ao clicar num link para fora, só o endereço do site é informado, não a página inteira.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Recursos do aparelho que o site não usa ficam bloqueados.
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=()"
    # Sempre por HTTPS.
    Strict-Transport-Security = "max-age=31536000"

# Páginas: sempre buscar a versão mais nova (CSS e JS já mudam de nome a cada versão com ?v=).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Avisos da gestão no celular: o service worker precisa estar sempre atualizado.
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Arquivos internos que não precisam ser servidos pelo site.
[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true
