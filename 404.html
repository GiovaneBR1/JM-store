<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Página não encontrada — JM Store</title>
<link rel="icon" href="/img/icon-192.png">
<style>
  :root { --bg: #FBF6F3; --ink: #3B1424; --ink-2: #6B3A48; --accent: #7E1F3B; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A0F14; --ink: #F4E7E2; --ink-2: #C9AEB5; --accent: #A3304F; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1rem; }
  h1 { font: 400 2.4rem/1.1 Georgia, serif; margin: 0 0 .5rem; }
  p { color: var(--ink-2); margin: 0 0 1.5rem; }
  a { display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: .8rem 1.5rem; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço pode ter mudado. Os produtos continuam na loja.</p>
    <a href="/">Ir para a JM Store</a>
  </main>
</body>
</html>
