<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JM Store — Cosméticos importados</title>
<meta name="description" content="Perfumes, maquiagem e skincare importados, com entrega no seu bairro ou retirada. Peça pelo WhatsApp e pague no PIX.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#app">Pular para o conteúdo</a>

<header class="top">
  <div class="top__in">
    <a class="logo" href="#/" aria-label="JM Store, página inicial">JM <span>Store</span></a>
    <form class="search" role="search" id="search-form">
      <label class="sr" for="search">Buscar produtos</label>
      <input id="search" type="search" placeholder="Buscar perfume, batom, sérum…" autocomplete="off">
    </form>
    <button class="bag-btn" id="bag-open" type="button" aria-label="Abrir sacola">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span>Sacola</span>
      <b id="bag-count" aria-live="polite">0</b>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <div class="foot__in">
    <div>
      <p class="logo logo--foot">JM <span>Store</span></p>
      <p>Cosméticos importados do Paraguai, escolhidos a dedo e entregues por nós mesmos.</p>
    </div>
    <div>
      <h2>Atendimento</h2>
      <p><a id="foot-wa" href="#" target="_blank" rel="noopener">Falar no WhatsApp</a></p>
      <p id="foot-pickup"></p>
    </div>
    <div>
      <h2>Pagamento</h2>
      <p>PIX ou combinado pelo WhatsApp. Pagamento na entrega mediante combinação.</p>
    </div>
  </div>
  <p class="foot__copy">© <span id="year"></span> JM Store</p>
</footer>

<a class="wa-float" id="wa-float" href="#" target="_blank" rel="noopener" aria-label="Falar com a JM Store no WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.6Zm5.8-7.9c-.3-.2-1.900-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.1 2.7 6.4 6.4 0 0 0 1.3 3.4 14.6 14.6 0 0 0 5.6 5c2.1.9 2.9 1 4 .8a3.4 3.4 0 0 0 2.2-1.6 2.8 2.8 0 0 0 .2-1.6c-.1-.1-.3-.2-.7-.4Z"/></svg>
</a>

<div class="drawer" id="drawer" hidden>
  <div class="drawer__scrim" data-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer__head">
      <h2 id="drawer-title">Sua sacola</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fechar sacola">✕</button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
